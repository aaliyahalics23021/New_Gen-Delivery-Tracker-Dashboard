{% extends "base.html" %}
{% block content %}
<h2>Add New Delivery</h2>
<form action="/add_delivery" method="post">
    <label>Customer Name:</label>
    <input type="text" name="customer" placeholder="Enter customer name" required>
    <label>Product Name:</label>
    <input type="text" name="product" placeholder="Enter product name" required>
    <label>Amount Paid:</label>
    <input type="number" name="amount" placeholder="Enter amount" step="0.01" required>
    <label>Driver:</label>
    <select name="driver" required>
        {% for driver in drivers %}
        <option value="{{ driver.name }}">{{ driver.name }} ({{ driver.phone }})</option>
        {% endfor %}
    </select>
    <button type="submit">Add Delivery</button>
</form>
{% endblock %}
