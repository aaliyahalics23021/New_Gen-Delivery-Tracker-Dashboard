<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Add Delivery — NextGen</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar small">
    <div class="brand"><div class="logo">📦</div><div class="title"><h1>Add Delivery</h1></div></div>
    <div class="header-actions">
      <a href="{{ url_for('index') }}" class="btn ghost">← Back</a>
    </div>
  </header>

  <main class="centered">
    <form id="deliveryForm" class="form-card">
      <h2>New Delivery</h2>
      <label class="form-row"><span>Customer</span><input name="customer_name" required placeholder="Customer name"></label>
      <label class="form-row"><span>Contact</span><input name="customer_contact" placeholder="Phone or email"></label>
      <label class="form-row"><span>Product</span><input name="product" required placeholder="Product name"></label>
      <label class="form-row"><span>Price</span><input name="price" type="number" step="0.01" placeholder="0.00"></label>
      <label class="form-row"><span>Assign Driver</span>
        <select name="driver_id" id="driverSelect"><option value="">— none —</option></select>
      </label>
      <div class="form-actions">
        <button type="submit" class="btn primary">Add Delivery</button>
        <a href="{{ url_for('index') }}" class="btn ghost">Cancel</a>
      </div>
    </form>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
