{% extends "base.html" %}
{% block content %}
<h2>Drivers</h2>
<form action="/add_driver" method="post">
    <label>Name:</label>
    <input type="text" name="name" required>
    <label>Phone:</label>
    <input type="text" name="phone" required>
    <button type="submit">Add Driver</button>
</form>

<h3>All Drivers</h3>
<table>
<tr><th>Name</th><th>Phone</th><th>Action</th></tr>
{% for d in drivers %}
<tr>
    <td>{{ d.name }}</td>
    <td>{{ d.phone }}</td>
    <td>
        <form action="/delete_driver/{{ d.id }}" method="post">
            <button type="submit" class="btn-danger">Delete</button>
        </form>
    </td>
</tr>
{% endfor %}
</table>
{% endblock %}
